<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Learning Course — Bilingual</title>
  <link rel="stylesheet" href="de/assets/style.css" />
  <style>
    .lang-switch {
      display: flex;
      gap: 0.5rem;
      justify-content: center;
      margin: 2rem 0 1rem;
    }
    .lang-switch a {
      padding: 0.5rem 1.5rem;
      border-radius: 2rem;
      text-decoration: none;
      font-weight: 500;
      transition: all 0.2s;
    }
    .lang-switch a.active {
      background: #00d9ff;
      color: #0a0a0a;
    }
    .lang-switch a:not(.active) {
      border: 1px solid #333;
      color: #888;
    }
    .lang-switch a:not(.active):hover {
      border-color: #00d9ff;
      color: #00d9ff;
    }
    .intro {
      text-align: center;
      margin: 2rem 0;
    }
    .intro h1 {
      margin-bottom: 0.5rem;
    }
  </style>
</head>
<body>
  <header id="topnav"></header>

  <div class="wrap">
    <div class="intro">
      <h1>AI Learning Course</h1>
      <p class="meta">Ein wachsendes, interaktives Wiki für KI — gebaut, um die Mechanik wirklich zu verstehen, nicht nur APIs zu bedienen.</p>
    </div>

    <div class="lang-switch">
      <a href="de/index.html" class="active">🇩🇪 Deutsch</a>
      <a href="en/index.html">🇺🇸 English</a>
    </div>

    <p style="text-align:center; color:#888; margin-bottom:2rem;">
      Choose your language / Wähle deine Sprache
    </p>

    <p style="text-align:center; margin-top:3rem;">
      <a href="https://github.com/SaltKing0/LearnAi" style="color:#00d9ff;">GitHub →</a>
    </p>
  </div>

  <footer id="bottomnav"></footer>
  <script src="de/assets/nav.js"></script>
</body>
</html>
