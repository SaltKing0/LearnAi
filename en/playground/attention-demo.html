<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Playground · Attention — AI Learning Course</title>
  <link rel="stylesheet" href="../assets/style.css" />
</head>
<body>
  <header id="topnav"></header>

  <div class="wrap">
    <p class="meta">Playground</p>
    <h1>Attention Demo</h1>

    <p>Type a sentence. The heatmap shows how much each word "looks at" every other word (simplified self-attention).</p>

    <div class="demo-box">
      <textarea id="inp" rows="3">The cat sat on the mat</textarea>
      <div class="controls">
        <button id="run" style="background:#58a6ff;color:#0e1116;border:none;border-radius:8px;padding:8px 16px;font-family:monospace;cursor:pointer;">Compute →</button>
      </div>
      <div id="heatmap"></div>
    </div>

    <h2>Related</h2>
    <ul>
      <li><a href="../concepts/14-attention-overview.html">14 · Attention</a></li>
    </ul>
  </div>

  <footer id="bottomnav"></footer>
  <script src="../assets/nav.js"></script>
  <script>
    // Simplified attention: words look at words that are close and meaningful
    function computeAttention(words) {
      const n = words.length;
      const scores = [];
      for (let i = 0; i < n; i++) {
        scores[i] = [];
        for (let j = 0; j < n; j++) {
          // Simplified: closer words get higher attention, same words get max
          const dist = Math.abs(i - j);
          const same = words[i].toLowerCase() === words[j].toLowerCase() ? 1 : 0;
          scores[i][j] = same * 0.8 + Math.exp(-dist * 0.5) * 0.3;
        }
      }
      return scores;
    }

    function render() {
      const text = document.getElementById("inp").value.trim();
      const words = text.split(/\s+/).filter(w => w.length > 0);
      const scores = computeAttention(words);
      const n = words.length;
      
      let html = '<div class="attn-grid" style="display:grid;grid-template-columns:repeat(' + n + ',1fr);gap:2px;margin-top:1rem;">';
      for (let i = 0; i < n; i++) {
        for (let j = 0; j < n; j++) {
          const s = scores[i][j];
          const r = Math.floor(255 * s);
          const g = Math.floor(166 * s);
          const b = Math.floor(87 * s);
          html += '<div style="background:rgb(' + r + ',' + g + ',' + b + ');padding:8px 4px;text-align:center;font-size:0.75rem;border-radius:4px;color:' + (s > 0.5 ? '#0a0a0a' : '#888') + ';">' + words[j] + '</div>';
        }
      }
      html += '</div>';
      document.getElementById("heatmap").innerHTML = html;
    }

    document.getElementById("run").addEventListener("click", render);
    document.getElementById("inp").addEventListener("input", render);
    render();
  </script>
</body>
</html>
